<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Q2-1: Classic Clock (ساعة) -->
  <rect width="400" height="300" fill="#1e293b"/>
  <circle cx="200" cy="150" r="108" fill="#f59e0b" stroke="#fde68a" stroke-width="6"/>
  <circle cx="200" cy="150" r="92" fill="#f8fafc"/>
  <g stroke="#0f172a" stroke-width="6" stroke-linecap="round">
    <line x1="200" y1="70" x2="200" y2="86"/>
    <line x1="200" y1="214" x2="200" y2="230"/>
    <line x1="120" y1="150" x2="136" y2="150"/>
    <line x1="264" y1="150" x2="280" y2="150"/>
  </g>
  <!-- Hands -->
  <line x1="200" y1="150" x2="200" y2="92" stroke="#0f172a" stroke-width="7" stroke-linecap="round"/>
  <line x1="200" y1="150" x2="246" y2="150" stroke="#e11d48" stroke-width="8" stroke-linecap="round"/>
  <circle cx="200" cy="150" r="9" fill="#0f172a"/>
</svg>
