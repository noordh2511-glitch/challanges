<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Q5-1: Spring Blooming Flowers (الربيع) -->
  <rect width="400" height="210" fill="#7dd3fc"/>
  <rect y="200" width="400" height="100" fill="#22c55e"/>
  <circle cx="330" cy="58" r="28" fill="#fde047"/>
  <!-- Blooming Flowers -->
  <g stroke="#15803d" stroke-width="6" stroke-linecap="round">
    <line x1="110" y1="240" x2="110" y2="156"/>
    <line x1="200" y1="252" x2="200" y2="136"/>
    <line x1="290" y1="240" x2="290" y2="160"/>
  </g>
  <!-- Pink Flower -->
  <g fill="#ec4899">
    <circle cx="110" cy="136" r="14"/><circle cx="128" cy="150" r="14"/><circle cx="92" cy="150" r="14"/><circle cx="110" cy="164" r="14"/>
  </g>
  <circle cx="110" cy="150" r="11" fill="#fde047"/>
  <!-- Purple Flower -->
  <g fill="#a855f7">
    <circle cx="200" cy="114" r="16"/><circle cx="220" cy="130" r="16"/><circle cx="180" cy="130" r="16"/><circle cx="200" cy="146" r="16"/>
  </g>
  <circle cx="200" cy="130" r="12" fill="#fde047"/>
  <!-- Red Tulip -->
  <g fill="#ef4444">
    <circle cx="290" cy="140" r="14"/><circle cx="308" cy="154" r="14"/><circle cx="272" cy="154" r="14"/><circle cx="290" cy="168" r="14"/>
  </g>
  <circle cx="290" cy="154" r="11" fill="#fde047"/>
</svg>
