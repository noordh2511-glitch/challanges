  <polygon points="480,295 494,165 530,165 544,295" fill="#f8fafc" stroke="#334155" stroke-width="3"/>
  <rect x="492" y="195" width="40" height="26" fill="#dc2626"/>
  <rect x="486" y="246" width="52" height="26" fill="#dc2626"/>
  <rect x="490" y="150" width="44" height="16" fill="#1e293b"/>
  <polygon points="486,150 512,126 538,150" fill="#dc2626"/>
  <!-- Sailboat in sea -->
  <path d="M180,268 L315,268 L294,294 L202,294 Z" fill="#78350f"/>
  <line x1="248" y1="144" x2="248" y2="268" stroke="#451a03" stroke-width="5"/>
  <!-- DIFF 2: YELLOW sail in B (was RED in A) -->
  <polygon points="252,148 320,256 252,256" fill="#facc15"/>
  <polygon points="244,168 194,256 244,256" fill="#f8fafc"/>
  <!-- Beach Umbrella on left -->
  <line x1="108" y1="255" x2="108" y2="355" stroke="#78350f" stroke-width="6"/>
  <path d="M52,262 Q108,215 164,262 Z" fill="#f59e0b"/>
  <!-- DIFF 3: Starfish is MISSING in B -->
</svg>
