<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Q1 Beach Scene - Image B (3 differences) -->
  <defs>
    <linearGradient id="bSkyB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
  </defs>
  <rect width="600" height="235" fill="url(#bSkyB)"/>
  <rect y="230" width="600" height="80" fill="#0369a1"/>
  <path d="M0,300 Q180,285 350,305 T600,295 L600,400 L0,400 Z" fill="#fde68a"/>
  <!-- Sun -->
  <circle cx="515" cy="72" r="36" fill="#fde047"/>
  <!-- DIFF 1: Cloud is MISSING in B -->
