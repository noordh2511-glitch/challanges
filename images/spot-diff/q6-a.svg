<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Q6 Study Desk - Image A (5 differences) -->
  <rect width="600" height="400" fill="#1e293b"/>
  <!-- Window -->
  <rect x="34" y="34" width="128" height="136" rx="8" fill="#38bdf8" stroke="#e2e8f0" stroke-width="7"/>
  <line x1="98" y1="34" x2="98" y2="170" stroke="#e2e8f0" stroke-width="5"/>
  <line x1="34" y1="102" x2="162" y2="102" stroke="#e2e8f0" stroke-width="5"/>
  <!-- DIFF 1: Clock showing 3:00 in A -->
  <circle cx="508" cy="84" r="42" fill="#f8fafc" stroke="#f59e0b" stroke-width="6"/>
  <line x1="508" y1="84" x2="508" y2="56" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
  <line x1="508" y1="84" x2="532" y2="84" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>
  <circle cx="508" cy="84" r="5" fill="#e11d48"/>
  <!-- Shelf with DIFF 2: 3 Books in A (Blue, Green, Yellow) -->
  <rect x="218" y="128" width="195" height="14" rx="4" fill="#92400e"/>
  <rect x="242" y="64" width="28" height="64" rx="3" fill="#2563eb"/>
  <rect x="276" y="54" width="28" height="74" rx="3" fill="#10b981"/>
  <rect x="310" y="70" width="28" height="58" rx="3" fill="#f59e0b"/>
  <!-- Desk -->
  <rect x="26" y="295" width="548" height="22" rx="6" fill="#b45309"/>
  <rect x="52" y="317" width="20" height="83" fill="#78350f"/>
  <rect x="528" y="317" width="20" height="83" fill="#78350f"/>
  <!-- DIFF 3: YELLOW Desk Lamp on left in A -->
  <rect x="58" y="285" width="48" height="10" rx="4" fill="#facc15"/>
  <path d="M82,285 L72,232 L106,208" fill="none" stroke="#eab308" stroke-width="6" stroke-linecap="round"/>
  <polygon points="98,196 132,214 116,230 90,212" fill="#facc15"/>
  <!-- DIFF 4: Mini Globe on left-middle of desk (present in A) -->
  <circle cx="164" cy="252" r="24" fill="#0284c7" stroke="#e2e8f0" stroke-width="3"/>
  <path d="M150,244 Q164,236 176,250 Q168,266 154,262 Z" fill="#22c55e"/>
  <rect x="150" y="285" width="28" height="10" rx="4" fill="#94a3b8"/>
  <line x1="164" y1="276" x2="164" y2="285" stroke="#94a3b8" stroke-width="4"/>
  <!-- Laptop -->
  <rect x="225" y="198" width="165" height="94" rx="8" fill="#0f172a" stroke="#94a3b8" stroke-width="5"/>
  <rect x="239" y="212" width="137" height="66" rx="3" fill="#0ea5e9" opacity="0.35"/>
  <rect x="208" y="287" width="199" height="10" rx="4" fill="#cbd5e1"/>
  <!-- DIFF 5: RED Mug on right of desk in A -->
  <path d="M474,264 C490,264 490,284 474,284" fill="none" stroke="#ef4444" stroke-width="6"/>
  <rect x="434" y="252" width="42" height="43" rx="6" fill="#ef4444"/>
</svg>
