<svg width="640" height="420" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420">
  <!-- Q2 Memory: Yellow School Bus #27 + Green Traffic Light -->
  <defs>
    <linearGradient id="busSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
  </defs>
  <rect width="640" height="295" fill="url(#busSky)"/>
  <!-- Road -->
  <rect y="290" width="640" height="130" fill="#334155"/>
  <line x1="20" y1="362" x2="620" y2="362" stroke="#f8fafc" stroke-width="8" stroke-dasharray="42 28"/>
  <!-- Sun -->
  <circle cx="95" cy="70" r="34" fill="#fde047"/>
  <!-- Yellow School Bus -->
  <rect x="74" y="138" width="388" height="162" rx="20" fill="#facc15" stroke="#b45309" stroke-width="5"/>
  <!-- Black Stripe -->
  <rect x="76" y="226" width="384" height="16" fill="#0f172a"/>
  <!-- 3 Bus Windows -->
  <rect x="98" y="158" width="84" height="54" rx="8" fill="#bae6fd" stroke="#0f172a" stroke-width="4"/>
  <rect x="196" y="158" width="84" height="54" rx="8" fill="#bae6fd" stroke="#0f172a" stroke-width="4"/>
  <rect x="294" y="158" width="84" height="54" rx="8" fill="#bae6fd" stroke="#0f172a" stroke-width="4"/>
  <!-- Front Windshield -->
  <rect x="392" y="158" width="54" height="54" rx="8" fill="#7dd3fc" stroke="#0f172a" stroke-width="4"/>
  <!-- BOLD BUS NUMBER 27 -->
  <rect x="218" y="246" width="96" height="44" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
  <text x="266" y="279" font-family="sans-serif" font-weight="900" font-size="32" text-anchor="middle" fill="#0f172a">27</text>
  <!-- Wheels -->
  <circle cx="152" cy="306" r="34" fill="#0f172a" stroke="#64748b" stroke-width="5"/>
  <circle cx="152" cy="306" r="14" fill="#cbd5e1"/>
  <circle cx="386" cy="306" r="34" fill="#0f172a" stroke="#64748b" stroke-width="5"/>
  <circle cx="386" cy="306" r="14" fill="#cbd5e1"/>
  <!-- Headlight -->
  <rect x="448" y="252" width="14" height="22" rx="4" fill="#fef08a"/>
  <!-- Traffic Light on right (GREEN LIGHT ON!) -->
  <rect x="550" y="182" width="14" height="144" fill="#475569"/>
  <rect x="526" y="58" width="62" height="134" rx="12" fill="#0f172a" stroke="#64748b" stroke-width="4"/>
  <!-- Red (dim/off) -->
  <circle cx="557" cy="88" r="15" fill="#450a0a"/>
  <!-- Yellow (dim/off) -->
  <circle cx="557" cy="125" r="15" fill="#422006"/>
  <!-- GREEN (BRIGHT ON!) -->
  <circle cx="557" cy="162" r="17" fill="#22c55e" stroke="#86efac" stroke-width="4"/>
</svg>
