<svg width="640" height="420" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420">
  <!-- Q5 Memory: Calendar #15 + 1 Red Book on Shelf (out of 5) + Black Cat -->
  <rect width="640" height="420" fill="#1e293b"/>
  <!-- Top Bookshelf with 5 Books: Blue, Green, 1 RED (center), Blue, Green -->
  <rect x="135" y="138" width="370" height="16" rx="5" fill="#92400e"/>
  <rect x="172" y="56" width="44" height="82" rx="4" fill="#2563eb" stroke="#1e3a8a" stroke-width="3"/>
  <rect x="228" y="48" width="44" height="90" rx="4" fill="#16a34a" stroke="#14532d" stroke-width="3"/>
  <!-- THE ONLY 1 RED BOOK -->
  <rect x="284" y="44" width="48" height="94" rx="4" fill="#ef4444" stroke="#991b1b" stroke-width="3"/>
  <rect x="344" y="54" width="44" height="84" rx="4" fill="#2563eb" stroke="#1e3a8a" stroke-width="3"/>
  <rect x="400" y="60" width="44" height="78" rx="4" fill="#16a34a" stroke="#14532d" stroke-width="3"/>
  <!-- Desk Surface -->
  <rect x="32" y="308" width="576" height="24" rx="6" fill="#b45309"/>
  <rect x="58" y="332" width="22" height="88" fill="#78350f"/>
  <rect x="560" y="332" width="22" height="88" fill="#78350f"/>
  <!-- BLACK CAT sitting on left of desk -->
  <g>
    <ellipse cx="148" cy="274" rx="34" ry="34" fill="#090d16" stroke="#475569" stroke-width="2"/>
    <circle cx="148" cy="224" r="24" fill="#090d16" stroke="#475569" stroke-width="2"/>
    <polygon points="128,210 134,186 146,204" fill="#090d16"/>
    <polygon points="150,204 162,186 168,210" fill="#090d16"/>
    <!-- Bright yellow eyes so black cat is unmistakable -->
    <circle cx="139" cy="222" r="4.5" fill="#fde047"/>
    <circle cx="157" cy="222" r="4.5" fill="#fde047"/>
    <path d="M180,294 Q212,282 204,250" fill="none" stroke="#090d16" stroke-width="10" stroke-linecap="round"/>
  </g>
  <!-- Big Desk Calendar clearly showing 15 -->
  <g>
    <rect x="275" y="196" width="124" height="112" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="4"/>
    <rect x="275" y="196" width="124" height="32" rx="8" fill="#e11d48"/>
    <circle cx="306" cy="212" r="5" fill="#f8fafc"/><circle cx="368" cy="212" r="5" fill="#f8fafc"/>
    <text x="337" y="286" font-family="sans-serif" font-weight="900" font-size="54" text-anchor="middle" fill="#0f172a">15</text>
  </g>
  <!-- Potted Plant on right -->
  <rect x="478" y="264" width="54" height="44" rx="6" fill="#d97706"/>
  <ellipse cx="505" cy="236" rx="16" ry="32" fill="#22c55e"/>
  <ellipse cx="484" cy="248" rx="12" ry="22" fill="#16a34a" transform="rotate(-24 484 248)"/>
  <ellipse cx="526" cy="248" rx="12" ry="22" fill="#16a34a" transform="rotate(24 526 248)"/>
