<svg width="640" height="420" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420">
  <!-- Q4 Memory: 5 Balloons + 3 Gift Boxes on Counter -->
  <rect width="640" height="420" fill="#0f172a"/>
  <!-- Festive Confetti Dots -->
  <g opacity="0.55">
    <circle cx="52" cy="54" r="6" fill="#fde047"/><circle cx="585" cy="64" r="6" fill="#38bdf8"/>
    <circle cx="540" cy="148" r="5" fill="#fb7185"/><circle cx="88" cy="165" r="5" fill="#4ade80"/>
  </g>
  <!-- Balloon Strings -->
  <g stroke="#cbd5e1" stroke-width="2.5" fill="none">
    <path d="M135,134 Q145,195 162,250"/>
    <path d="M225,112 Q225,180 232,250"/>
    <path d="M320,96 Q320,175 320,250"/>
    <path d="M415,112 Q415,180 408,250"/>
    <path d="M505,134 Q495,195 478,250"/>
  </g>
  <!-- EXACTLY 5 BALLOONS (clearly separated!) -->
  <!-- Balloon 1 (Red) -->
  <ellipse cx="135" cy="96" rx="34" ry="42" fill="#ef4444" stroke="#991b1b" stroke-width="3"/>
  <!-- Balloon 2 (Blue) -->
  <ellipse cx="225" cy="76" rx="34" ry="42" fill="#3b82f6" stroke="#1d4ed8" stroke-width="3"/>
  <!-- Balloon 3 (Yellow) -->
  <ellipse cx="320" cy="62" rx="34" ry="42" fill="#facc15" stroke="#ca8a04" stroke-width="3"/>
  <!-- Balloon 4 (Purple) -->
  <ellipse cx="415" cy="76" rx="34" ry="42" fill="#a855f7" stroke="#6b21a8" stroke-width="3"/>
  <!-- Balloon 5 (Green) -->
  <ellipse cx="505" cy="96" rx="34" ry="42" fill="#22c55e" stroke="#15803d" stroke-width="3"/>
  <!-- Counter Table -->
  <rect x="44" y="330" width="552" height="24" rx="6" fill="#b45309"/>
  <rect x="74" y="354" width="22" height="66" fill="#78350f"/>
  <rect x="544" y="354" width="22" height="66" fill="#78350f"/>
  <!-- EXACTLY 3 GIFT BOXES on Table -->
  <!-- Gift 1 (Left - Cyan with Yellow Ribbon) -->
  <g>
    <rect x="118" y="246" width="96" height="84" rx="6" fill="#06b6d4" stroke="#0e7490" stroke-width="4"/>
    <rect x="158" y="246" width="16" height="84" fill="#fde047"/>
    <rect x="118" y="278" width="96" height="16" fill="#fde047"/>
    <ellipse cx="152" cy="238" rx="14" ry="9" fill="#fde047"/>
    <ellipse cx="180" cy="238" rx="14" ry="9" fill="#fde047"/>
  </g>
  <!-- Gift 2 (Center - Rose/Pink with White Ribbon) -->
  <g>
    <rect x="266" y="226" width="108" height="104" rx="6" fill="#ec4899" stroke="#9d174d" stroke-width="4"/>
    <rect x="311" y="226" width="18" height="104" fill="#f8fafc"/>
    <rect x="266" y="268" width="108" height="18" fill="#f8fafc"/>
    <ellipse cx="305" cy="216" rx="16" ry="10" fill="#f8fafc"/>
    <ellipse cx="335" cy="216" rx="16" ry="10" fill="#f8fafc"/>
  </g>
  <!-- Gift 3 (Right - Orange with Purple Ribbon) -->
  <g>
    <rect x="426" y="246" width="96" height="84" rx="6" fill="#f97316" stroke="#9a3412" stroke-width="4"/>
    <rect x="466" y="246" width="16" height="84" fill="#a855f7"/>
    <rect x="426" y="278" width="96" height="16" fill="#a855f7"/>
