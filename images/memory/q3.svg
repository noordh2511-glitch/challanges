<svg width="640" height="420" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420">
  <!-- Q3 Memory: Wall Clock at 4:00 + 3 Picture Frames + Green Sofa -->
  <rect width="640" height="335" fill="#334155"/>
  <rect y="330" width="640" height="90" fill="#78350f"/>
  <!-- 3 Framed Pictures on left wall -->
  <g stroke="#f59e0b" stroke-width="5">
    <rect x="64" y="64" width="76" height="92" rx="4" fill="#38bdf8"/>
    <rect x="160" y="64" width="76" height="92" rx="4" fill="#fb7185"/>
    <rect x="256" y="64" width="76" height="92" rx="4" fill="#a78bfa"/>
  </g>
  <!-- Simple art inside frames -->
  <polygon points="74,146 102,100 130,146" fill="#0284c7"/>
  <circle cx="198" cy="110" r="20" fill="#fde047"/>
  <polygon points="266,146 294,104 322,146" fill="#7c3aed"/>
  <!-- Large Clear Wall Clock showing EXACTLY 4:00 -->
  <circle cx="488" cy="116" r="66" fill="#f8fafc" stroke="#f59e0b" stroke-width="8"/>
  <g font-family="sans-serif" font-weight="900" font-size="18" text-anchor="middle" fill="#0f172a">
    <text x="488" y="72">12</text>
    <text x="536" y="122">3</text>
    <text x="528" y="146" fill="#dc2626">4</text>
    <text x="488" y="172">6</text>
    <text x="440" y="122">9</text>
  </g>
  <!-- Minute hand pointing straight up at 12 -->
  <line x1="488" y1="116" x2="488" y2="74" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>
  <!-- Hour hand pointing clearly at 4 (120 degrees clockwise from 12 -> +30, +17) -->
  <line x1="488" y1="116" x2="518" y2="134" stroke="#dc2626" stroke-width="7" stroke-linecap="round"/>
  <circle cx="488" cy="116" r="6" fill="#0f172a"/>
  <!-- BRIGHT GREEN SOFA -->
  <rect x="122" y="232" width="380" height="106" rx="18" fill="#16a34a" stroke="#14532d" stroke-width="5"/>
  <!-- Back Cushions -->
  <rect x="148" y="218" width="156" height="72" rx="14" fill="#22c55e" stroke="#14532d" stroke-width="4"/>
  <rect x="318" y="218" width="156" height="72" rx="14" fill="#22c55e" stroke="#14532d" stroke-width="4"/>
  <!-- Armrests -->
  <rect x="96" y="264" width="44" height="80" rx="14" fill="#15803d" stroke="#14532d" stroke-width="4"/>
  <rect x="482" y="264" width="44" height="80" rx="14" fill="#15803d" stroke="#14532d" stroke-width="4"/>
  <!-- Sofa Legs -->
  <rect x="116" y="340" width="16" height="24" rx="3" fill="#451a03"/>
  <rect x="490" y="340" width="16" height="24" rx="3" fill="#451a03"/>
</svg>
