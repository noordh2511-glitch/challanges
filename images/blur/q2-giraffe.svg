      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="55%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
  </defs>
  <rect width="640" height="310" fill="url(#savannaSky)"/>
  <circle cx="135" cy="108" r="46" fill="#fef9c3" opacity="0.9"/>
  <!-- Ground -->
  <rect y="305" width="640" height="115" fill="#65a30d"/>
