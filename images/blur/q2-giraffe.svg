  <rect x="85" y="220" width="16" height="96" fill="#78350f"/>
  <ellipse cx="93" cy="212" rx="74" ry="22" fill="#15803d"/>
  <!-- Giraffe -->
  <!-- Legs -->
  <g fill="#f59e0b">
    <rect x="275" y="275" width="16" height="112" rx="6"/>
    <rect x="305" y="280" width="16" height="106" rx="6"/>
    <rect x="372" y="275" width="16" height="112" rx="6"/>
    <rect x="400" y="280" width="16" height="106" rx="6"/>
