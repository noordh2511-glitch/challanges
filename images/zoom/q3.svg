<svg width="640" height="420" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420">
  <!-- Q3 Zoom: Classic Wristwatch (zoomOrigin: 50% 50%) -->
  <rect width="640" height="420" fill="#0f172a"/>
  <!-- Leather Watch Strap (Top & Bottom) -->
  <rect x="256" y="0" width="128" height="420" fill="#78350f" stroke="#451a03" stroke-width="5"/>
  <!-- Stitching on Strap -->
  <line x1="270" y1="10" x2="270" y2="410" stroke="#fbbf24" stroke-width="3" stroke-dasharray="10 8" opacity="0.7"/>
  <line x1="370" y1="10" x2="370" y2="410" stroke="#fbbf24" stroke-width="3" stroke-dasharray="10 8" opacity="0.7"/>
  <!-- Crown Dial Button on Right -->
  <rect x="448" y="192" width="22" height="36" rx="6" fill="#d97706" stroke="#92400e" stroke-width="3"/>
  <!-- Golden Watch Bezel -->
  <circle cx="320" cy="210" r="134" fill="#f59e0b" stroke="#fde68a" stroke-width="6"/>
  <circle cx="320" cy="210" r="116" fill="#fefce8" stroke="#92400e" stroke-width="4"/>
  <!-- Inner Decorative Ring -->
  <circle cx="320" cy="210" r="88" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
  <!-- Hour Markers -->
  <g stroke="#0f172a" stroke-width="6" stroke-linecap="round">
    <line x1="320" y1="106" x2="320" y2="126"/>
    <line x1="320" y1="294" x2="320" y2="314"/>
    <line x1="216" y1="210" x2="236" y2="210"/>
    <line x1="404" y1="210" x2="424" y2="210"/>
  </g>
  <g stroke="#475569" stroke-width="3.5" stroke-linecap="round">
    <line x1="372" y1="120" x2="364" y2="134"/>
    <line x1="410" y1="158" x2="396" y2="166"/>
    <line x1="410" y1="262" x2="396" y2="254"/>
    <line x1="372" y1="300" x2="364" y2="286"/>
    <line x1="268" y1="300" x2="276" y2="286"/>
    <line x1="230" y1="262" x2="244" y2="254"/>
    <line x1="230" y1="158" x2="244" y2="166"/>
    <line x1="268" y1="120" x2="276" y2="134"/>
  </g>
  <!-- Numbers 12, 3, 6, 9 -->
  <g font-family="sans-serif" font-weight="900" font-size="22" text-anchor="middle" fill="#0f172a">
    <text x="320" y="150">12</text>
    <text x="390" y="218">3</text>
    <text x="320" y="286">6</text>
    <text x="250" y="218">9</text>
  </g>
  <!-- Date Window -->
  <rect x="348" y="198" width="26" height="22" rx="3" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="361" y="215" font-family="sans-serif" font-weight="800" font-size="14" text-anchor="middle" fill="#0f172a">22</text>
  <!-- Watch Hands (10:10 classic pose around 50% 50%) -->
  <line x1="320" y1="210" x2="268" y2="174" stroke="#0f172a" stroke-width="9" stroke-linecap="round"/>
  <line x1="320" y1="210" x2="378" y2="162" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
  <line x1="320" y1="210" x2="320" y2="282" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
  <!-- Center Gold Pin -->
  <circle cx="320" cy="210" r="10" fill="#f59e0b" stroke="#0f172a" stroke-width="3"/>
</svg>
