    <circle cx="268" cy="184" r="28"/>
    <circle cx="366" cy="188" r="28"/>
    <circle cx="320" cy="242" r="30"/>
    <circle cx="294" cy="306" r="24"/>
    <circle cx="348" cy="296" r="22"/>
  </g>
  <!-- Pepperoni Speckle Details -->
