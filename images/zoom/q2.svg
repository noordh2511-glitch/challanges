<svg width="640" height="420" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420">
  <!-- Q2 Zoom: Pepperoni Pizza Slice (zoomOrigin: 50% 56%) -->
  <rect width="640" height="420" fill="#1c1917"/>
