    <circle cx="312" cy="235" r="4"/><circle cx="330" cy="248" r="3.5"/><circle cx="324" cy="228" r="3"/>
    <circle cx="260" cy="178" r="3.5"/><circle cx="372" cy="182" r="3.5"/>
  </g>
