  <ellipse cx="285" cy="220" rx="28" ry="18" fill="#fef08a" opacity="0.65"/>
  <ellipse cx="355" cy="245" rx="24" ry="16" fill="#fef08a" opacity="0.65"/>
  <!-- Pepperoni Slices (clustered richly around 50% 56% = 320, 235) -->
