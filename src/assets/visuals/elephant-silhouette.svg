<svg width="560" height="400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400">
  <!-- Transparent background so filter: brightness(0) creates a crisp black silhouette! -->
  <g>
    <!-- Back legs -->
    <rect x="200" y="255" width="44" height="105" rx="16" fill="#475569"/>
    <rect x="335" y="255" width="44" height="105" rx="16" fill="#475569"/>
    <!-- Tail -->
    <path d="M405,195 Q455,215 446,275" fill="none" stroke="#64748b" stroke-width="10" stroke-linecap="round"/>
    <ellipse cx="446" cy="283" rx="9" ry="14" fill="#334155"/>
    <!-- Body -->
    <ellipse cx="295" cy="205" rx="125" ry="92" fill="#64748b"/>
    <!-- Royal saddle blanket -->
    <path d="M235,120 Q295,108 355,122 L348,195 Q295,210 242,195 Z" fill="#e11d48"/>
    <path d="M242,188 Q295,202 348,188" fill="none" stroke="#fbbf24" stroke-width="7"/>
    <circle cx="295" cy="155" r="14" fill="#fbbf24"/>
    <!-- Front legs -->
    <rect x="172" y="260" width="48" height="112" rx="18" fill="#64748b"/>
    <rect x="308" y="260" width="48" height="112" rx="18" fill="#64748b"/>
    <!-- Toenails -->
    <g fill="#e2e8f0">
      <ellipse cx="182" cy="366" rx="7" ry="5"/><ellipse cx="198" cy="368" rx="7" ry="5"/>
      <ellipse cx="318" cy="366" rx="7" ry="5"/><ellipse cx="334" cy="368" rx="7" ry="5"/>
    </g>
    <!-- Head -->
    <circle cx="170" cy="168" r="68" fill="#64748b"/>
    <!-- Big Ear -->
    <ellipse cx="222" cy="162" rx="54" ry="70" fill="#94a3b8"/>
    <ellipse cx="222" cy="164" rx="38" ry="52" fill="#fda4af" opacity="0.7"/>
    <!-- Trunk -->
    <path d="M120,185 C82,202 74,270 96,300 C112,320 140,310 136,288 C132,276 116,282 118,266 C120,235 138,215 154,212" fill="none" stroke="#64748b" stroke-width="34" stroke-linecap="round"/>
    <!-- Tusk -->
    <path d="M136,204 Q92,238 66,216 Q88,255 148,225 Z" fill="#fef3c7"/>
    <!-- Eye -->
    <circle cx="145" cy="154" r="9" fill="#0f172a"/>
    <circle cx="142" cy="151" r="3" fill="#ffffff"/>
  </g>
</svg>
