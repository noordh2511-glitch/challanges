<svg width="640" height="420" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420">
  <!-- Al-Khazneh (The Treasury) in Petra, Jordan -->
  <rect width="640" height="420" fill="#451a03"/>
  <!-- Canyon Walls (Siq) -->
  <polygon points="0,0 135,0 112,420 0,420" fill="#291206"/>
  <polygon points="640,0 505,0 528,420 640,420" fill="#291206"/>
  <!-- Rose-Red Rock Face -->
  <rect x="112" y="12" width="416" height="390" fill="#9a3412"/>
  <!-- Ground -->
  <rect x="0" y="372" width="640" height="48" fill="#d97706"/>
  <!-- Upper Treasury Tholos & Pediments -->
  <rect x="176" y="42" width="288" height="16" fill="#c2410c"/>
  <polygon points="184,78 258,48 258,78" fill="#fb923c" stroke="#7c2d12" stroke-width="3"/>
  <polygon points="456,78 382,48 382,78" fill="#fb923c" stroke="#7c2d12" stroke-width="3"/>
  <!-- Center Urn & Tholos -->
  <circle cx="320" cy="48" r="14" fill="#fdba74"/>
  <polygon points="282,82 320,54 358,82" fill="#f97316"/>
  <rect x="292" y="82" width="56" height="92" fill="#ea580c" stroke="#7c2d12" stroke-width="3"/>
  <!-- Side Upper Columns -->
  <g fill="#fb923c" stroke="#7c2d12" stroke-width="2">
    <rect x="196" y="82" width="18" height="92"/><rect x="234" y="82" width="18" height="92"/>
    <rect x="388" y="82" width="18" height="92"/><rect x="426" y="82" width="18" height="92"/>
  </g>
  <!-- Middle Entablature & Pediment -->
  <rect x="158" y="174" width="324" height="22" fill="#fdba74" stroke="#7c2d12" stroke-width="3"/>
  <polygon points="222,222 320,178 418,222" fill="#fb923c" stroke="#7c2d12" stroke-width="3"/>
  <!-- Lower 6 Iconic Columns -->
  <g fill="#f97316" stroke="#7c2d12" stroke-width="3">
    <rect x="174" y="222" width="22" height="148"/>
    <rect x="220" y="222" width="22" height="148"/>
    <rect x="266" y="222" width="22" height="148"/>
    <rect x="352" y="222" width="22" height="148"/>
    <rect x="398" y="222" width="22" height="148"/>
    <rect x="444" y="222" width="22" height="148"/>
  </g>
  <!-- Dark Treasury Entrance -->
  <rect x="298" y="256" width="44" height="114" fill="#1c0a02"/>
</svg>
