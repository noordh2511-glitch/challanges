<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Spot the Difference - Image B (3 clear differences from A) -->
  <defs>
    <linearGradient id="skyB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
  </defs>
  <rect width="600" height="280" fill="url(#skyB)"/>
  <rect y="275" width="600" height="125" fill="#22c55e"/>
  <!-- Sun -->
  <circle cx="95" cy="78" r="36" fill="#fde047"/>
  <!-- Cloud -->
  <g fill="#ffffff">
    <ellipse cx="290" cy="75" rx="48" ry="18"/>
    <ellipse cx="325" cy="68" rx="34" ry="16"/>
  </g>
  <!-- DIFFERENCE 1: Bird is MISSING in B -->
  <!-- House -->
  <rect x="200" y="168" width="195" height="122" fill="#fef3c7" stroke="#92400e" stroke-width="4"/>
  <polygon points="182,172 298,92 414,172" fill="#dc2626" stroke="#7f1d1d" stroke-width="4"/>
  <!-- Chimney -->
  <rect x="342" y="106" width="26" height="44" fill="#991b1b"/>
  <!-- Windows -->
  <rect x="222" y="194" width="42" height="42" rx="4" fill="#38bdf8" stroke="#78350f" stroke-width="4"/>
  <rect x="332" y="194" width="42" height="42" rx="4" fill="#38bdf8" stroke="#78350f" stroke-width="4"/>
  <!-- DIFFERENCE 2: Door is BLUE in B (was RED in A) -->
  <rect x="278" y="216" width="40" height="74" rx="4" fill="#2563eb" stroke="#1e3a8a" stroke-width="3"/>
  <circle cx="309" cy="255" r="4" fill="#fde047"/>
  <!-- Path -->
  <polygon points="278,290 318,290 350,400 246,400" fill="#d6d3d1"/>
  <!-- Tree on right -->
  <rect x="485" y="218" width="24" height="78" fill="#78350f"/>
  <circle cx="497" cy="195" r="44" fill="#15803d"/>
  <circle cx="470" cy="212" r="30" fill="#16a34a"/>
  <circle cx="524" cy="212" r="30" fill="#16a34a"/>
  <!-- DIFFERENCE 3: Orange Cat is MISSING in B -->
  <!-- Flowers on left -->
  <circle cx="90" cy="325" r="9" fill="#ec4899"/>
  <circle cx="135" cy="340" r="9" fill="#facc15"/>
  <circle cx="170" cy="322" r="9" fill="#a855f7"/>
</svg>
